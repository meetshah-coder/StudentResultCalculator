<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Result Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Student Result Calculator</h1>
    <form id="resultForm">
      <label for="name">Student Name:</label>
      <input type="text" id="name" required />

      <label for="roll">Roll Number:</label>
      <input type="text" id="roll" required />

      <label for="java">Java Marks:</label>
      <input type="number" id="java" min="0" max="100" required />

      <label for="dbms">DBMS Marks:</label>
      <input type="number" id="dbms" min="0" max="100" required />

      <label for="ds">Data Structures Marks:</label>
      <input type="number" id="ds" min="0" max="100" required />

      <label for="maths">Maths Marks:</label>
      <input type="number" id="maths" min="0" max="100" required />

      <button type="submit">Calculate Result</button>
    </form>

    <div id="resultOutput"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
